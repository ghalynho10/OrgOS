# CI (AGENTS.md, Tooling and tests): lint, typecheck, and all of pytest,
# including the integration tests on real store containers. Eval runs never
# happen here, so eval scores cannot fail CI.
name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  checks:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The FROZEN test compares eval/FROZEN with its copy at the eval-frozen tag.
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  tests:
    name: Tests (unit and integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The FROZEN test compares eval/FROZEN with its copy at the eval-frozen tag.
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # The runner's Docker daemon serves Testcontainers; no compose stack runs here.
      - run: uv run pytest
