[project]
name = "orgos"
version = "0.1.0"
description = "A shared operational memory over company work data, compared across a SQL store and a graph store."
authors = [
    { name = "Ghaly Nicolas Jules", email = "32783189+ghalynho10@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "dbt-core~=1.12.6",
    "dbt-postgres>=1.11,<2",
    "dlt[postgres]>=1.31,<2",
    "neo4j>=6.4,<7",
    "psycopg[binary]>=3.3,<4",
    "pydantic-ai-slim[anthropic]>=2.61,<3",
    "pydantic-settings>=2.16,<3",
    "pymongo>=4.19,<5",
    "typer>=0.27,<0.28",
]

[project.scripts]
orgos = "orgos.cli:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pre-commit>=4.7,<5",
    "pytest>=9.1,<10",
    "ruff>=0.17.2,<0.18",
    "testcontainers[mongodb,neo4j,postgres]>=4.15,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: starts real database containers (stop the compose stack first)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt", "spikes"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff specific
    "BLE",     # no blind `except Exception`
    # The docstring rule from AGENTS.md: every module, package, and public function.
    "D100", "D103", "D104",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/orgos"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
