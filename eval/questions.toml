shape = "number"
unit = "seconds"
fields = [
    "key",
    "fields.parent.key",
    "changelog.items[field=timespent].from/to",
]
reading = """
Population: the parent issue with key equal to "CLOUD-643" in CLOUD and every direct sub-task whose fields.parent.key equals "CLOUD-643". Include issues contributing zero logged time. No date bounds apply.
