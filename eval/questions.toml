[[question]]
id = "Q01"
text = "For each of the seven projects, how many issues created between January 1 and March 31, 2013 (UTC) are still unresolved and have no assignee?"
type = "aggregate"
hops = 0
hop_mode = "fixed"
shape = "map"
unit = "count"
fields = [
    "fields.project.key",
    "fields.created",
    "fields.resolution.name",
    "fields.assignee.key",
]
reading = """
Population: issues whose current fields.project.key is BAM, CLOUD, CLOV, CRUC, CWD, FE or JRASERVER. Count qualifying issues per project and list all seven projects, including zeros.
"Created between January 1 and March 31, 2013 (UTC)" means fields.created in the half-open interval [2013-01-01T00:00:00Z, 2013-04-01T00:00:00Z).
"Still unresolved" means fields.resolution.name is missing, null or exactly "". "Have no assignee" means fields.assignee.key is missing, null or exactly "". Missing includes a leaf unavailable because its containing object is missing or null.
Sources, step by step: (1) select issue records by fields.project.key in the seven-project population; (2) retain those whose fields.created falls within the UTC interval; (3) retain those whose fields.resolution.name is missing, null or exactly ""; (4) retain those whose fields.assignee.key is missing, null or exactly ""; (5) count the retained issue records per project. For each project, list every qualifying issue record with its fields.project.key, fields.created, fields.resolution.name and fields.assignee.key values, identifying missing values as missing. A project with count zero has an empty qualifying-issue list.
Use current dump values; no changelog history is used.
If empty: widen along date range.
"""
data = "real"
tracer = true

[[question]]
id = "Q02"
text = "In CWD, how many issues are already marked Fixed in a version that has not yet been released?"
type = "aggregate"
hops = 0
hop_mode = "fixed"
shape = "number"
unit = "count"
fields = [
    "fields.project.key",
    "fields.resolution.name",
    "fields.fixVersions[].released",
]
reading = """
Population: issues whose current fields.project.key equals "CWD". No date bounds apply.
"Marked Fixed" means fields.resolution.name equals "Fixed". "In a version that has not yet been released" means at least one fields.fixVersions[].released value equals false.
Sources, step by step: (1) select issue records with fields.project.key equal to "CWD"; (2) retain those with fields.resolution.name equal to "Fixed"; (3) retain those with at least one fields.fixVersions[].released value equal to false; (4) count each retained issue once. List every qualifying issue record with its fields.project.key, fields.resolution.name and fields.fixVersions[].released values. A zero answer has an empty qualifying-issue list.
Use current dump values; no changelog history is used.
If empty: widen along projects.
"""
data = "real"

[[question]]
id = "Q03"
text = "How many issues resolved in FE between April 1 and June 30, 2012 (UTC) were closed after their due date?"
type = "aggregate"
hops = 0
hop_mode = "fixed"
shape = "number"
unit = "count"
fields = [
    "fields.project.key",
    "fields.resolution.name",
    "fields.resolutiondate",
    "fields.duedate",
]
reading = """
Population: issues whose current fields.project.key equals "FE".
"Resolved" and "closed" mean fields.resolution.name exists, is not null and is not "". No status condition applies.
"Resolved between April 1 and June 30, 2012 (UTC)" means fields.resolutiondate is in the half-open interval [2012-04-01T00:00:00Z, 2012-07-01T00:00:00Z).
"After their due date" means fields.duedate is present and not null, and fields.resolutiondate is strictly later than the instant represented by fields.duedate, converted to UTC. A date-only due value means midnight UTC at the start of that day.
Sources, step by step: (1) select issue records with fields.project.key equal to "FE"; (2) retain those whose fields.resolution.name exists, is not null and is not ""; (3) retain those whose fields.resolutiondate falls within the UTC interval; (4) retain those with a present, non-null fields.duedate and a fields.resolutiondate strictly later than that due instant; (5) count each retained issue once. List every qualifying issue record with its fields.project.key, fields.resolution.name, fields.resolutiondate and fields.duedate values. A zero answer has an empty qualifying-issue list.
Use current dump values; no changelog history is used.
If empty: widen along date range.
"""
data = "real"

[[question]]
id = "Q04"
text = "For each project, how does the total time logged compare with the total original estimates for its issues?"
type = "aggregate"
hops = 0
hop_mode = "fixed"
shape = "map"
unit = "seconds"
fields = [
    "fields.project.key",
    "fields.timeoriginalestimate",
    "changelog.items[field=timespent].from/to",
]
reading = """
Population: issues whose current fields.project.key is BAM, CLOUD, CLOV, CRUC, CWD, FE or JRASERVER. Include issues with either logged time or an original estimate; missing values contribute 0. No date bounds apply.
"Total time logged" means the sum of positive, non-bot time-entry amounts, each reconstructed as to minus from in seconds from changelog.items[field=timespent].from/to. "Total original estimates" means the sum of current fields.timeoriginalestimate values.
For each project, return total logged seconds minus total original estimated seconds. A positive value means logged time exceeded estimates.
Sources, step by step: (1) list every issue record in the seven-project population, including issues contributing zero, with its fields.project.key and fields.timeoriginalestimate value, identifying missing values as missing; (2) for each issue, list every contributing positive, non-bot time entry with its changelog.items[field=timespent].from/to pair and computed amount; (3) sum those entry amounts per project; (4) sum original estimates per project, treating missing estimates as 0; (5) subtract the original-estimate total from the logged-time total for each project.
Use changelog history to reconstruct time entries only. Original estimates and project membership use current dump values; no other changelog history is used.
If empty: widen along status.
"""
data = "real"

[[question]]
id = "Q05"
text = "Which people have logged hours on issues assigned to someone else, and how many hours have they logged on those issues?"
type = "aggregate"
hops = 0
hop_mode = "fixed"
shape = "map"
unit = "seconds"
fields = [
    "fields.assignee.key",
    "changelog.histories[].author.key",
    "changelog.items[field=timespent].from/to",
]
reading = """
Population: issues in the seven corpus projects: BAM, CLOUD, CLOV, CRUC, CWD, FE and JRASERVER. No date bounds apply.
"Unassigned" means fields.assignee.key is missing, null or exactly "". Missing includes a leaf unavailable because its containing object is missing or null. Exclude unassigned issues and issues whose current assignee is a flagged bot.
"People" means non-bot time-entry authors identified by changelog.histories[].author.key. "Assigned to someone else" means the issue's current fields.assignee.key differs from the entry author's key.
"Logged hours" means the sum of positive, non-bot time-entry amounts, each reconstructed as to minus from in seconds from changelog.items[field=timespent].from/to. Sum qualifying amounts per author, store the result in seconds and divide by 3600 only for display in hours.
Sources, step by step: (1) select issues in the seven-project population; (2) exclude unassigned issues and issues assigned to flagged bots; (3) retain positive, non-bot time entries whose changelog.histories[].author.key differs from the issue's current fields.assignee.key; (4) sum retained entry amounts per author. For each returned author, list every contributing issue and time entry, showing fields.assignee.key, changelog.histories[].author.key, the changelog.items[field=timespent].from/to pair and its computed amount.
Use changelog history to reconstruct time entries only. Assignee and project membership use current dump values; no other changelog history is used.
If empty: widen along status.
"""
data = "real"

[[question]]
id = "Q06"
text = "Between October 1 and December 31, 2009 (UTC), which five issues across all projects had the most logged hours while remaining unresolved, ranked with their projects?"
type = "aggregate"
hops = 0
hop_mode = "fixed"
shape = "ranking"
unit = "seconds"
fields = [
    "key",
    "fields.project.key",
    "fields.resolution.name",
    "changelog.histories[].created",
    "changelog.items[field=timespent].from/to",
]
reading = """
Population: issues whose current fields.project.key is BAM, CLOUD, CLOV, CRUC, CWD, FE or JRASERVER, whose current fields.resolution.name is missing, null or exactly "", and which have at least one positive, non-bot time entry in the UTC interval below. Missing includes a leaf unavailable because its containing object is missing or null.
"Remaining unresolved" means the current fields.resolution.name is missing, null or exactly ""; it does not require the issue to have been unresolved throughout the period.
"Between October 1 and December 31, 2009 (UTC)" means the time entry's changelog.histories[].created, converted to UTC, falls in the half-open interval [2009-10-01T00:00:00Z, 2010-01-01T00:00:00Z).
"Logged hours" means the sum of positive, non-bot time-entry amounts, each reconstructed as to minus from in seconds from changelog.items[field=timespent].from/to. Store totals in seconds and divide by 3600 only for display in hours.
Rank issues by total qualifying logged seconds, highest first. Return the top five issues and every issue tied with the fifth. If fewer than five issues qualify, return all qualifying issues. Identify each issue by key and give its current fields.project.key.
Sources, step by step: (1) select issues in the seven-project population with a current missing, null or empty-string fields.resolution.name; (2) retain positive, non-bot time entries whose changelog.histories[].created falls within the UTC interval; (3) exclude issues with no retained entries; (4) sum retained entry amounts per issue; (5) rank highest first and apply the tie-inclusive top-five cut. For every returned issue, list its key, fields.project.key and fields.resolution.name, identifying missing values as missing, and every contributing entry's changelog.histories[].created and changelog.items[field=timespent].from/to values with its computed amount.
Use changelog history to reconstruct and date time entries only. Resolution and project membership use current dump values; no other changelog history is used.
If empty: widen along date range.
"""
data = "real"

[[question]]
id = "Q07"
text = "Which issues have the largest difference between their original estimates and actual logged time, and who logged time against them?"
type = "aggregate"
hops = 0
hop_mode = "fixed"
shape = "ranking"
unit = "seconds"
fields = [
    "key",
    "fields.timeoriginalestimate",
    "changelog.histories[].author.key",
    "changelog.items[field=timespent].from/to",
]
reading = """
Population: issues in BAM, CLOUD, CLOV, CRUC, CWD, FE and JRASERVER whose current fields.timeoriginalestimate is greater than 0 and which have at least one positive, non-bot time entry. No date bounds apply.
"Original estimate" means the current fields.timeoriginalestimate value in seconds. "Actual logged time" means the sum of positive, non-bot time-entry amounts, each reconstructed as to minus from in seconds from changelog.items[field=timespent].from/to.
For each issue, compute the absolute difference between its original estimate and its total qualifying logged seconds. Rank highest difference first. Return the top 10 issues and every issue tied with the tenth. If fewer than 10 issues qualify, return all qualifying issues. Identify each issue by key.
"Who logged time" means the distinct non-bot people identified by changelog.histories[].author.key on the issue's positive time entries. List all such people for each returned issue.
Sources, step by step: (1) select issues in the seven-project population whose fields.timeoriginalestimate is greater than 0; (2) retain positive, non-bot time entries and exclude issues with none; (3) sum retained entry amounts per issue; (4) compute each issue's absolute difference from its original estimate; (5) rank highest first and apply the tie-inclusive top-10 cut; (6) list distinct authors of the retained entries for each returned issue. For every returned issue, list its key, fields.timeoriginalestimate and every contributing entry's changelog.histories[].author.key and changelog.items[field=timespent].from/to values with its computed amount.
Use changelog history to reconstruct time entries only. Original estimates and project membership use current dump values; no other changelog history is used.
If empty: widen along status.
"""
data = "real"

[[question]]
id = "Q08"
text = "Which unresolved issues depend on other unresolved issues, and what are the complete dependency chains connecting them?"
type = "path_connection"
hops = 2
hop_mode = "variable"
max_hops = 5
shape = "path"
unit = "none"
fields = [
    "key",
    "fields.resolution.name",
    "fields.issuelinks[].type.outward",
    "fields.issuelinks[].outwardIssue.key",
]
reading = """
Population: issues in BAM, CLOUD, CLOV, CRUC, CWD, FE and JRASERVER. Every issue in a chain must belong to this population. No date bounds apply.
"Unresolved" means the current fields.resolution.name is missing, null or exactly "". Missing includes a leaf unavailable because its containing object is missing or null.
"Depends on" means fields.issuelinks[].type.outward equals "depends on". Follow that relation only from the source issue to fields.issuelinks[].outwardIssue.key. Parent relations and shared-person connections do not count.
Identify issues by key. Paths are simple: no issue may repeat. Return only complete dependency chains that cannot be extended at either end through another qualifying dependency relation without repeating an issue. Do not return chains starting partway through an extendable chain.
Return only complete chains of at most five hops. A five-hop chain qualifies only if it cannot be extended at either end without repeating an issue. Exclude partial sections of longer chains. Do not include a limit-related notice in the answer. An empty answer means no complete qualifying chain fits within the cap; it does not establish that no longer chain exists.
Sources, step by step: (1) select unresolved issues in the seven-project population; (2) identify outward "depends on" links whose endpoints are both unresolved corpus issues; (3) construct simple paths following those links in their outward direction; (4) retain only complete chains of at most five hops. For every returned chain, list every supporting issue record with its key and fields.resolution.name, and every supporting link record with its fields.issuelinks[].type.outward and fields.issuelinks[].outwardIssue.key values, identifying the source issue for each link.
Use current dump values; no changelog history is used.
If empty: widen along status.
"""
data = "real"

[[question]]
id = "Q09"
text = "Which chains of related issues show work passing between different assignees, and what are the people, issues, projects, and relationship types in each chain?"
type = "path_connection"
hops = 2
hop_mode = "variable"
max_hops = 5
shape = "path"
unit = "none"
fields = [
    "key",
    "fields.project.key",
    "fields.assignee.key",
    "fields.issuelinks[].type.outward",
    "fields.issuelinks[].type.inward",
    "fields.issuelinks[].outwardIssue.key",
    "fields.issuelinks[].inwardIssue.key",
]
reading = """
Population: issues whose current fields.project.key is BAM, CLOUD, CLOV, CRUC, CWD, FE or JRASERVER. Every issue in a chain must belong to this population. No date bounds apply.
"People" means non-bot assignees identified by current fields.assignee.key. Exclude issues whose assignee key is missing, null or exactly "", or identifies a flagged bot. Missing includes a leaf unavailable because its containing object is missing or null.
"Work passing between different assignees" means consecutive issues have different current fields.assignee.key values. This uses current assignments and does not establish historical handoffs.
"Related issues" means issues connected by any issue-link type. Follow links in either direction: use fields.issuelinks[].outwardIssue.key with fields.issuelinks[].type.outward, or fields.issuelinks[].inwardIssue.key with fields.issuelinks[].type.inward. Report the label corresponding to each traversal direction. Parent relations and shared-person connections do not count.
Identify issues by key and report each issue's current fields.project.key and fields.assignee.key. Paths are simple: no issue may repeat. Return only complete chains that cannot be extended at either end through another qualifying link without repeating an issue. Do not return chains starting partway through an extendable chain.
Return only complete chains of at most five hops. A five-hop chain qualifies only if it cannot be extended at either end without repeating an issue. Exclude partial sections of longer chains. Do not include a limit-related notice in the answer. An empty answer means no complete qualifying chain fits within the cap; it does not establish that no longer chain exists.
Sources, step by step: (1) select issues in the seven-project population with qualifying assignees; (2) identify issue links whose endpoints both qualify and have different assignee keys; (3) construct simple paths following those links in either direction; (4) retain only complete chains of at most five hops. For every returned chain, list every supporting issue record with its key, fields.project.key and fields.assignee.key, and every supporting link record with the applicable outward or inward label and endpoint key, identifying the source issue for each step.
Use current dump values; no changelog history is used.
If empty: widen along status.
"""
data = "real"

[[question]]
id = "Q10"
text = "Which people have worked on issues that block, depend on, duplicate, or supersede issues assigned to other people, and which people are connected through those relationships?"
type = "path_connection"
hops = 1
hop_mode = "fixed"
shape = "set"
unit = "none"
fields = [
    "key",
    "fields.assignee.key",
    "fields.issuelinks[].type.outward",
    "fields.issuelinks[].type.inward",
    "fields.issuelinks[].outwardIssue.key",
    "fields.issuelinks[].inwardIssue.key",
]
reading = """
Population: issues in BAM, CLOUD, CLOV, CRUC, CWD, FE and JRASERVER. Both issues in each qualifying relationship must belong to this population. No date bounds apply.
"Worked on" means the issue's current fields.assignee.key. People are non-bot assignees. Exclude issues whose assignee key is missing, null or exactly "", or identifies a flagged bot. Missing includes a leaf unavailable because its containing object is missing or null.
"Other people" means the source and target issues have different fields.assignee.key values.
A qualifying relationship is one issue-link hop: the source issue has fields.issuelinks[].type.outward equal to "blocks", "depends on" or "duplicates", with the target identified by fields.issuelinks[].outwardIssue.key; or it has fields.issuelinks[].type.inward equal to "supersedes", with the target identified by fields.issuelinks[].inwardIssue.key. Follow only these specified directions. Parent relations and shared-person connections do not count.
Return the distinct people identified by the source issues' fields.assignee.key values, each as one person ID. A target assignee appears in the answer only if that person is also a source assignee in a qualifying relationship. Connections to target assignees are recorded in the sources rather than returned as pairs.
Sources, step by step: (1) select source and target issues in the seven-project population with qualifying non-bot assignees; (2) identify links matching the specified labels and directions; (3) retain relationships whose source and target assignee keys differ; (4) return distinct source assignee person IDs. For every returned person, list every supporting source issue, target issue and qualifying link, showing each issue's key and fields.assignee.key, and the applicable fields.issuelinks[].type.outward or fields.issuelinks[].type.inward label with its corresponding endpoint key. Include every qualifying target assignee in those supporting records.
Use current dump values; no changelog history is used.
If empty: widen along issue type.
"""
data = "real"

