shape = "set"
unit = "none"
fields = [
    "key",
    "fields.project.key",
    "fields.parent.key",
    "fields.assignee.key",
]
reading = """
Population: parent issues and contributing sub-tasks whose current fields.project.key is "CLOUD" or "CLOV". No date bounds apply.
"Sub-tasks" means direct children identified by each child's fields.parent.key matching the parent issue's key. Traverse from parent to direct child only. Grandchildren, issue links and shared-person connections do not count.
"People" means non-bot assignees identified by each child's current fields.assignee.key. Exclude assignee keys that are missing, null or exactly "", or identify flagged bots. Missing includes a leaf unavailable because its containing object is missing or null.
"Assigned to multiple people" means the parent's direct sub-tasks have at least two distinct qualifying fields.assignee.key values. Return only the qualifying parents as issue IDs identified by key, each once. Their assignees are identified in the sources, not included as person IDs in the answer set.
Sources, step by step: (1) select parent issues in CLOUD or CLOV; (2) identify their direct sub-tasks using the children's fields.parent.key; (3) retain sub-tasks in CLOUD or CLOV with qualifying non-bot assignees; (4) collect distinct assignee keys per parent; (5) return the issue IDs of parents with at least two such keys. For every returned parent, list its issue record and every direct sub-task establishing its qualifying assignees, showing each issue's key and fields.project.key, and each contributing child's fields.parent.key and fields.assignee.key. Include every qualifying assignee in those supporting records.
Use current dump values; no changelog history is used.
If empty: widen along status.
"""
data = "real"

