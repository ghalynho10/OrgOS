]
reading = """
Population: issues whose current fields.project.key is BAM, CLOUD, CLOV, CRUC, CWD, FE or JRASERVER, and non-bot people holding qualifying roles on those issues. No date bounds apply.
"Assignment", "reporting" and "creation" mean the current fields.assignee.key, fields.reporter.key and fields.creator.key, respectively. A time-logging role means changelog.histories[].author.key on a positive time entry whose amount is reconstructed as to minus from in seconds from changelog.items[field=timespent].from/to.
For each role, exclude keys that are missing, null or exactly "", and keys identifying flagged bots. Missing includes a leaf unavailable because its containing object is missing or null.
Two distinct people are connected when both hold at least one qualifying role on the same issue. The roles may be the same or different. This shared-issue connection is the only hop kind; issue links and parent relations do not count.
Return one set containing every person participating in at least one qualifying connection as a person ID, and every project supporting at least one qualifying connection as a project ID identified by fields.project.key. Include each person and project once. The answer does not contain pairs; the sources establish which people are connected through which issues and projects.
Sources, step by step: (1) select issues in the seven-project population; (2) identify qualifying assignee, reporter and creator keys from current issue fields; (3) identify qualifying time-entry authors from positive, non-bot entries; (4) identify unordered pairs of distinct people holding roles on the same issue and the projects supporting those connections; (5) return the distinct participating person IDs and supporting project IDs together in one set. For every qualifying connection, list every supporting shared issue, its fields.project.key, both people's role keys and the role-field paths establishing them, and every qualifying time entry used to establish a logging role, showing its changelog.histories[].author.key and changelog.items[field=timespent].from/to values with its computed amount.
Use changelog history to reconstruct time entries only. Assignment, reporting, creation and project membership use current dump values; no other changelog history is used.
If empty: widen along projects.
"""
data = "real"

[[question]]
id = "Q12"
